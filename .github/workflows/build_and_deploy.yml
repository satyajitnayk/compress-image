name: Build, Deploy, and Run on GCP

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1 # Updated action to setup Rust
        with:
          rust-version: stable # You can specify a version like "1.56.0" or "stable"

      - name: Add Linux target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload to GCP VM
        env:
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          GCP_VM_IP: ${{ secrets.GCP_VM_IP }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          echo "$GCP_SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          scp -i key.pem -o StrictHostKeyChecking=no \
            target/x86_64-unknown-linux-gnu/release/compress-image \
            $GCP_VM_USER@$GCP_VM_IP:~/compress-image

      - name: Run Binary on GCP VM
        env:
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          GCP_VM_IP: ${{ secrets.GCP_VM_IP }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          echo "$GCP_SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no $GCP_VM_USER@$GCP_VM_IP << 'EOF'
            # Stop any running instance of the app (if any)
            pkill compress-image || true
            
            # Run the new binary
            nohup ./compress-image &

            # Optional: Check if the binary is running
            ps aux | grep compress-image
          EOF
